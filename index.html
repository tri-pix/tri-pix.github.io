<style>
:root{--bg:#fff;--fg:#000;--mute:#6B6B6B;--line:#EAEAEA;--ph:#F3F3F3;--m:clamp(20px,4vw,72px);--g:clamp(12px,1.6vw,28px);--f:'Onest','Helvetica Neue',Arial,sans-serif;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*:before,*:after{box-sizing:inherit}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font:400 16px/1.55 var(--f);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:2px solid #000;outline-offset:4px}
h1,h2,h3{font-weight:500;margin:0;letter-spacing:-.03em;line-height:1}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:rgba(255,255,255,.92);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px var(--m);font-size:14px}
header .logo{font-weight:600;letter-spacing:-.01em}
nav{display:flex;gap:clamp(16px,2.6vw,40px)}
nav a,.lang button{color:var(--mute);transition:color .2s}
nav a:hover,nav a[aria-current],.lang button[aria-pressed=true]{color:var(--fg)}
.lang{display:flex;gap:10px}
.lang button{background:none;border:0;padding:0;font:inherit;cursor:pointer}
.menu{display:none;background:none;border:0;font:inherit;font-size:14px;cursor:pointer;padding:0}
main{min-height:60vh}
.hero-t{display:grid;grid-template-columns:repeat(12,1fr);gap:var(--g);align-items:end;padding:clamp(40px,6vw,96px) var(--m) clamp(28px,4vw,56px)}
.hero h1{grid-column:1/9;font-size:clamp(26px,5.4vw,96px);font-weight:400;white-space:nowrap;margin:0}
.hd{grid-column:9/13}
.hd p{margin:0 0 14px;color:var(--fg);font-size:15px;line-height:1.5}
.hd a.cta{border-bottom:1px solid;font-size:15px}
.hero-i .ph,.hero-i img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}
body>header{border-bottom:1px solid var(--line)}

.ph{background:var(--ph);display:flex;align-items:center;justify-content:center;color:#B5B5B5;font-size:12px;letter-spacing:.02em}
.sec{padding:clamp(72px,12vw,200px) var(--m) 0}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:clamp(24px,4vw,56px)}
.sec-h h2{font-size:clamp(28px,3.6vw,56px)}
.sec-h a{font-size:14px;color:var(--mute)}
.sec-h a:hover{color:var(--fg)}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:clamp(36px,5vw,88px) var(--g);align-items:end}
.card{display:block}
.card .im{overflow:hidden;background:var(--ph)}
.card .ph,.card img{width:100%;aspect-ratio:var(--r,3/2);object-fit:cover;display:block;transition:transform .9s cubic-bezier(.2,.6,.2,1),opacity .4s}
.card:hover .ph,.card:hover img{transform:scale(1.02)}
.card h3{font-size:clamp(16px,1.4vw,20px);font-weight:500;letter-spacing:-.01em;margin-top:14px}
.card span{display:block;color:var(--mute);font-size:14px;margin-top:2px}
.s-a{grid-column:1/-1}.s-b{grid-column:1/8}.s-c{grid-column:9/13}.s-d{grid-column:2/7}.s-e{grid-column:8/13}.s-f{grid-column:1/6}.s-g{grid-column:7/13}
.about{display:grid;grid-template-columns:repeat(12,1fr);gap:var(--g)}
.about .l{grid-column:1/6;color:var(--mute);font-size:14px}
.about .r{grid-column:6/13}
.about h2{font-size:clamp(32px,5vw,80px);margin-bottom:28px}
.about p{font-size:clamp(18px,1.8vw,26px);line-height:1.4;letter-spacing:-.01em;margin:0;max-width:34ch}
.srv{display:grid;grid-template-columns:repeat(12,1fr);gap:var(--g)}
.srv h3{grid-column:1/6;font-size:clamp(22px,2.4vw,36px);margin-bottom:20px}
.srv ul{grid-column:6/13;list-style:none;margin:0 0 clamp(40px,6vw,88px);padding:0}
.srv li{padding:14px 0;border-top:1px solid var(--line);font-size:clamp(16px,1.4vw,20px)}
.srv .sub li{color:var(--mute)}
.srv li a{display:block}.srv li a:hover{color:var(--mute)}
.sv{all:unset;box-sizing:border-box;display:block;width:100%;cursor:pointer;color:var(--mute);transition:color .2s}.sv:hover{color:var(--fg)}.sv:focus-visible{outline:2px solid #000;outline-offset:4px}
dialog{border:0;padding:clamp(28px,4vw,56px);width:min(560px,calc(100% - 2*var(--m)));background:#fff;color:#000;font-family:var(--f)}
dialog::backdrop{background:rgba(255,255,255,.8)}
dialog h3{font-size:clamp(26px,3vw,40px);margin-bottom:18px}
dialog p{margin:0 0 32px;color:var(--mute);font-size:17px;max-width:40ch}
dialog .a{display:flex;justify-content:space-between;align-items:center;font-size:15px}
dialog .a button{all:unset;cursor:pointer;color:var(--mute)}dialog .a button:hover,dialog .a .go{color:#000}
dialog .a .go{border-bottom:1px solid;cursor:pointer}
dialog,dialog.wide{max-height:92vh}
dialog.wide{width:min(980px,calc(100% - 2*var(--m)))}
dialog.wide p{max-width:68ch;margin-bottom:20px}
.dh{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px}.dh h3{margin:0}
#dx{all:unset;cursor:pointer;font-size:22px;line-height:1;padding:4px 8px;color:var(--mute)}#dx:hover{color:#000}#dx:focus-visible{outline:2px solid #000}
.wl{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--g)}
.wp{all:unset;box-sizing:border-box;cursor:pointer;display:block}
.wp .th{display:block;background:var(--ph);overflow:hidden}
.wp .th img,.wp .th .ph{width:100%;aspect-ratio:16/10;object-fit:cover;object-position:top;display:block;transition:transform .6s}
.wp:hover .th img{transform:scale(1.02)}
.wp .wt{display:block;margin-top:12px;font-size:17px;font-weight:500}
.wp .wy{display:block;color:var(--mute);font-size:14px}
.wp:focus-visible{outline:2px solid #000;outline-offset:4px}
.bk{all:unset;cursor:pointer;color:var(--mute);font-size:14px;margin-bottom:18px;display:inline-block}.bk:hover{color:#000}.bk:focus-visible{outline:2px solid #000}
dialog .ty{color:var(--mute);margin-bottom:10px}
.mn{display:flex;flex-wrap:wrap;gap:8px 18px;margin:0 0 12px;font-size:14px;align-items:baseline}.mn span{color:var(--mute);margin-right:6px}.mn i{font-style:normal;border-bottom:1px solid var(--line)}
.shots{display:grid;gap:14px;margin:24px 0 0}
.shots img,.mob img,.ex img{width:100%;display:block;border:1px solid var(--line)}
dialog h4{font-weight:500;font-size:15px;color:var(--mute);margin:28px 0 12px}
.mob{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:start}
.ex{max-width:70%}
dialog .ft{margin-top:32px}
@media(max-width:860px){.wl{grid-template-columns:1fr}.mob{grid-template-columns:repeat(2,1fr)}.ex{max-width:100%}}

.contact{padding:clamp(96px,16vw,260px) var(--m) clamp(40px,6vw,72px)}
.contact h2{font-size:clamp(44px,10vw,180px);font-weight:400}
.contact p{margin:14px 0 36px;color:var(--mute);font-size:clamp(18px,2vw,28px)}
.contact .links{display:flex;gap:clamp(20px,4vw,56px);flex-wrap:wrap;font-size:clamp(18px,1.8vw,24px)}
.contact .links a{border-bottom:1px solid var(--line);transition:border-color .2s}
.contact .links a:hover{border-color:#000}
footer{display:flex;justify-content:space-between;padding:20px var(--m) 28px;color:var(--mute);font-size:13px;border-top:1px solid var(--line);margin:0 var(--m);padding-left:0;padding-right:0}
.pg-h{padding:clamp(48px,8vw,120px) var(--m) clamp(32px,5vw,72px)}
.pg-h h1{font-size:clamp(40px,8vw,140px);font-weight:400}
.pd-h{padding:clamp(40px,7vw,110px) var(--m) clamp(28px,4vw,56px);display:grid;grid-template-columns:repeat(12,1fr);gap:var(--g)}
.pd-h .t{grid-column:1/9}
.pd-h h1{font-size:clamp(36px,7vw,120px);font-weight:400}
.pd-h .ty{color:var(--mute);margin-top:16px}
.pd-h .d{grid-column:9/13;align-self:end;font-size:15px;color:var(--mute)}
.pd-h .d p{margin:0 0 8px}
.gal{display:grid;grid-template-columns:repeat(12,1fr);gap:var(--g);padding:0 var(--m)}
.gal figure{margin:0}
.gal .ph,.gal img{width:100%;display:block;aspect-ratio:var(--r,16/9);object-fit:cover}
.f{grid-column:1/-1}.h{grid-column:span 6}.lg{grid-column:3/13}
.full-bleed{grid-column:1/-1;margin:0 calc(var(--m)*-1)}
.pn{display:flex;justify-content:space-between;gap:16px;padding:clamp(72px,12vw,180px) var(--m) 0;font-size:clamp(18px,2.2vw,32px);letter-spacing:-.02em}
.pn a{display:block;max-width:46%}.pn small{display:block;color:var(--mute);font-size:13px;letter-spacing:0;margin-bottom:6px}
.pn .nx{text-align:right;margin-left:auto}
.back{padding:36px var(--m) 0;font-size:14px;color:var(--mute)}
.back a:hover{color:var(--fg)}
.rv{opacity:0;transition:opacity 1s ease}.rv.in{opacity:1}
@media(max-width:860px){
 .hero-t{display:block;padding-top:36px}
 .hero h1{font-size:8vw}
 .hd{margin-top:20px}
 .hero-i .ph,.hero-i img{aspect-ratio:4/3}
 header{flex-wrap:wrap}
 .menu{display:block}
 nav{display:none;order:3;width:100%;flex-direction:column;gap:14px;padding:14px 0 6px;font-size:18px}
 nav.open{display:flex}
 .grid{grid-template-columns:1fr;gap:44px}
 .grid>*{grid-column:1!important}
 .about,.srv,.pd-h{display:block}
 .about .l{margin-bottom:20px}
 .srv h3{margin-bottom:10px}
 .pd-h .d{margin-top:24px}
 .gal{grid-template-columns:1fr}
 .f,.h,.lg{grid-column:1/-1}
 .gal .ph,.gal img{aspect-ratio:var(--rm,4/3)}
 .pn a{max-width:48%}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}.rv{opacity:1}}

.hero-i{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--g);padding:0 var(--m)}
.hero-i img,.hero-i .ph{aspect-ratio:3/4;object-fit:cover;width:100%;display:block}
.pos{margin:0;font-size:clamp(24px,3.6vw,60px);line-height:1.15;letter-spacing:-.025em;max-width:24em}
.srvl{border-bottom:1px solid var(--line)}
.sv.row{display:grid;grid-template-columns:64px 1.3fr 1.7fr 28px;gap:var(--g);align-items:baseline;padding:clamp(18px,2.4vw,32px) 0;border-top:1px solid var(--line);color:var(--fg);text-align:left}
.sv.row .nm{font-size:clamp(22px,2.8vw,44px);letter-spacing:-.025em;line-height:1.05}
.sv.row .n,.sv.row .ds{color:var(--mute);font-size:15px}
.sv.row .ar{transition:transform .3s}.sv.row:hover .ar{transform:translateX(5px)}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(32px,4vw,64px) var(--g)}
.g3 .card .ph,.g3 .card img{aspect-ratio:4/3}
.tm{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--g)}
.tm .ph{aspect-ratio:1/1;width:100%}.tm h3{margin-top:14px;font-size:clamp(18px,1.6vw,22px);font-weight:500;letter-spacing:-.01em}.tm span{display:block;color:var(--mute);font-size:14px;margin-top:2px}
@media(max-width:860px){.sv.row{grid-template-columns:36px 1fr 24px}.sv.row .ds{grid-column:2/3}.g3,.tm{grid-template-columns:1fr}.hero-i img,.hero-i .ph{aspect-ratio:2/3}}

.hero h1{white-space:normal;text-wrap:balance;font-size:clamp(28px,4.8vw,84px);line-height:1.05;max-width:none}
.vt{position:relative;aspect-ratio:3/4;background:var(--ph);overflow:hidden;display:flex;align-items:center;justify-content:center;color:#B5B5B5;font-size:12px}
.vt video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tp{width:100%;aspect-ratio:1/1;object-fit:cover;object-position:50% 22%;display:block}
.dgs{margin-bottom:clamp(56px,8vw,120px)}.dgs .sec-h{margin-bottom:10px}.dd{color:var(--mute);margin:0 0 28px}
.vg{padding:0 var(--m)}.vc{display:grid;grid-template-columns:5fr 7fr;gap:var(--g);margin-top:clamp(40px,6vw,88px)}
.vc h4{font-weight:500;font-size:15px;color:var(--mute);margin:0 0 16px}
.vl{list-style:none;margin:0;padding:0}.vl li{padding:14px 0;border-top:1px solid var(--line);font-size:clamp(16px,1.4vw,20px)}
.vr{display:flex;justify-content:space-between;gap:16px;padding:18px 0;border-top:1px solid var(--line);font-size:clamp(18px,1.8vw,26px);letter-spacing:-.015em}
.vr span+span{color:var(--mute);font-size:14px;white-space:nowrap}.vr:hover span:first-child{color:var(--mute)}
@media(max-width:860px){.hero h1{font-size:8vw}.vc{grid-template-columns:1fr;gap:40px}}

.vl3{border-bottom:1px solid var(--line)}

.vr3 .nm{font-size:clamp(18px,1.8vw,26px);letter-spacing:-.015em}.vr3 .sp{color:var(--mute);font-size:15px}

.hero-i{display:flex;gap:var(--g);height:clamp(300px,36vw,680px)}
.hero-i .hf{flex:1 1 0;min-width:0;overflow:hidden;background:var(--ph);transition:flex .7s cubic-bezier(.2,.6,.2,1);display:block}
.hero-i .hf:hover,.hero-i .hf:focus-visible{flex:3 1 0}
.hero-i .hf img{width:100%;height:100%;aspect-ratio:auto;object-fit:cover;display:block}
.hero-i .vt{flex:0 0 24%;aspect-ratio:auto;height:auto}
@media(max-width:860px){.hero-i{flex-direction:column;height:auto}.hero-i .hf,.hero-i .vt{flex:none;height:62vw}.hero-i .hf:hover{flex:none}}

.hd a.cta{display:inline-block;background:#000;color:#fff;border:0;padding:13px 24px;transition:opacity .2s}
.hd a.cta:hover{opacity:.82}

.figc{grid-column:1/-1}
dialog.xl{width:min(1400px,calc(100% - 2*var(--m)));padding:clamp(18px,2.4vw,32px)}

<section class="sec" id="team"><div class="sec-h"><h2>${x.nav.team}</h2></div><div class="tm">${x.team.map((m,i)=>`<div class="rv">${[PHD,PHO,PHV][i]?`<img class="tp" src="${[PHD,PHO,PHV][i]}" alt="${m[0]}" style="${i===1?'object-position:50% 40%':i===0?'object-position:50% 18%':''}">`:`<div class="ph" style="--r:1">${x.photo}</div>`}<h3>${m[0]}</h3><span>${m[1]}</span></div>`).join('')}</div></section>
${contact()}`}

const BR="assets/17.jpg";

const PHO="assets/19.jpg";
const PHV="assets/20.jpg";
const YT=[['Паша Осовцов','https://youtu.be/raxZ8KSLDdo'],['Подкаст «Тутти Фрутти»','https://www.youtube.com/watch?v=xKABh8RYWPI'],['Миша Сеин','https://www.youtube.com/watch?v=Hw85_qRv0Jg'],['Доктор Шуров','https://www.youtube.com/watch?v=B15I-hs0B20'],['Гештальт-терапевт Никита Савельев','https://www.youtube.com/watch?v=nfM7nirOq_Q']];
const SITES=[{"n": {"ru": "IT-NIKA", "en": "IT-NIKA"}, "s": {"ru": "IT / внедрение CRM-систем", "en": "IT / CRM implementation"}, "l": [{"ru": "Новый дизайн (Figma)", "en": "New design (Figma)", "u": "https://www.figma.com/proto/Bn4W970UG87IRvq9u23JtT/IT-NIKA?node-id=38-15&t=jIFUimkatNyMWlwp-0&scaling=scale-down-width&content-scaling=fixed&page-id=0%3A1"}]}, {"n": {"ru": "Invest Group", "en": "Invest Group"}, "s": {"ru": "Инвестиции / недвижимость", "en": "Investment / real estate"}, "l": [{"ru": "Сайт", "en": "Website", "u": "https://www.igsamara.ru/"}]}, {"n": {"ru": "DeloArt", "en": "DeloArt"}, "s": {"ru": "Digital / брендинг / разработка", "en": "Digital / branding / development"}, "l": [{"ru": "Сайт", "en": "Website", "u": "https://brand.deloart.ru/"}]}, {"n": {"ru": "Delo Art / X-Party", "en": "Delo Art / X-Party"}, "s": {"ru": "Чат-боты / автоматизация бизнеса", "en": "Chatbots / business automation"}, "l": [{"ru": "Страница чат-бота", "en": "Chatbot page", "u": "https://bot.x-party.ru/"}]}, {"n": {"ru": "HOGO Smart", "en": "HOGO Smart"}, "s": {"ru": "Умные устройства / системы доступа / IoT", "en": "Smart devices / access systems / IoT"}, "l": [{"ru": "Сайт", "en": "Website", "u": "https://hogo-smart.ru/"}]}, {"n": {"ru": "A-Store", "en": "A-Store"}, "s": {"ru": "E-commerce / электроника и гаджеты", "en": "E-commerce / electronics and gadgets"}, "l": [{"ru": "Сайт", "en": "Website", "u": "https://a-store63.ru/"}]}, {"n": {"ru": "Biorav", "en": "Biorav"}, "s": {"ru": "Медицина / центр восточной медицины", "en": "Medicine / oriental medicine center"}, "l": [{"ru": "Сайт", "en": "Website", "u": "https://biorav.ru/"}]}, {"n": {"ru": "Фитнес-проект", "en": "Fitness project"}, "s": {"ru": "Фитнес / спорт", "en": "Fitness / sports"}, "l": [{"ru": "Сайт", "en": "Website", "u": "https://xn----jtbictd3abeep5frb.xn--p1ai/"}]}];
function digital(){const x=t();
 const pl=()=>`<div class="card rv"><div class="im"><div class="ph" style="--r:1.33">${x.soon}</div></div></div>`;
 const rows=SITES.map((p,i)=>`<div class="vr3 rv"><span class="nm">${p.n[lang]}</span><span class="sp">${p.s[lang]}</span><span class="lk">${p.l.map(l=>`<a href="${l.u}" target="_blank" rel="noopener">${l[lang]} ↗</a>`).join('')}</span></div>`).join('');
 const blk=(i,body,c)=>`<section class="dgs"><div class="sec-h"><h2>${x.dg[i][0]}</h2></div><p class="dd">${x.dg[i][1]}</p><div class="${c}">${body}</div></section>`;
 return crumbs([[x.svc[1][0]]])+`<div class="pg-h"><h1>${x.svc[1][0]}</h1></div><div style="padding:0 var(--m)"><p class="pos" style="font-size:clamp(20px,2.4vw,34px);margin-bottom:clamp(32px,5vw,64px)">${x.dgi}</p><div class="vl3">${rows}</div></div>${contact()}`}
function video(){const x=t();
 return crumbs([[x.svc[2][0]]])+`<div class="pg-h"><h1>${x.svc[2][0]}</h1></div><div class="vg"><p class="pos" style="font-size:clamp(20px,2.4vw,34px)">${x.vi}</p>
 <div class="vc"><div><h4>${x.vs}</h4><ul class="vl">${x.vl.map(i=>`<li>${i}</li>`).join('')}</ul></div>
 <div><h4>${x.vw}</h4><div class="vrw">${YT.map(y=>`<a class="vr" href="${y[1]}" target="_blank" rel="noopener"><span>${y[0]}</span><span>${x.yt} ↗</span></a>`).join('')}</div></div></div></div>${contact()}`}
function crumbs(a){const x=t();return `<nav class="bc" aria-label="${lang==='ru'?'Навигация':'Breadcrumb'}"><a href="#/">${x.hm}</a>`+a.map(i=>` <span aria-hidden="true">/</span> `+(i[1]?`<a href="${i[1]}">${i[0]}</a>`:`<span aria-current="page">${i[0]}</span>`)).join('')+`</nav>`}
function list(){const x=t();return crumbs([[x.tt]])+`<div class="pg-h"><h1>${x.tt}</h1></div><section style="padding:0 var(--m)">${grid(projects)}</section>${contact()}`}
const lay=['f','h h','f','lg','h h','f']; // gallery rhythm; repeats for any count
function gallery(imgs,title){const out=[];let i=0,k=0;while(i<imgs.length){const l=lay[k%lay.length].split(' ');const n=Math.min(l.length,imgs.length-i);
 for(let j=0;j<n;j++){const im=imgs[i+j],c=n===1?l[0]:'h';const ratio=n>1?Math.min(...imgs.slice(i,i+n).map(q=>q.ratio)):im.ratio;
 out.push(`<figure class="${c} rv">${media({...im,alt:im.alt||title+' — '+(i+j+1),ratio},'',i+j===0)}</figure>`)}
 i+=n;k++}return out.join('')}
function detail(slug){const x=t(),i=projects.findIndex(p=>p.slug===slug);if(i<0)return `<div class="pg-h"><h1>404</h1></div><p class="back"><a href="#/projects">${x.back}</a></p>`;
 const p=projects[i],pr=projects[(i-1+projects.length)%projects.length],nx=projects[(i+1)%projects.length];
 const meta=[['year',p.year],['client',p.client],['loc',p.location]].filter(m=>m[1]).map(m=>`<p>${x[m[0]]}: ${m[1]}</p>`).join('');
 document.title=`${p.title[lang]} — ${x.suf} | TRI-PIX`;
 return crumbs([[x.tt,'#/projects'],[p.title[lang]]])+`<article><header class="pd-h" style="position:static;backdrop-filter:none;background:none;padding-top:clamp(40px,7vw,110px)"><div class="t"><h1>${p.title[lang]}</h1><div class="ty">${x.cat[p.category]}</div></div><div class="d">${meta}${p.description[lang]?`<p>${p.description[lang]}</p>`:''}</div></header>
 <div class="gal">${gallery(p.images,p.title[lang])}</div></article>
 <nav class="pn" aria-label="Projects"><a href="#/projects/${pr.slug}"><small>← ${x.prev}</small>${pr.title[lang]}</a><a class="nx" href="#/projects/${nx.slug}"><small>${x.next} →</small>${nx.title[lang]}</a></nav>
 <p class="back" style="padding-bottom:0"><a href="#/projects">${x.back}</a></p><div style="height:clamp(56px,8vw,120px)"></div>`}

/* ---------- ROUTER ---------- */
let pendingScroll=null;
let path=(location.hash||'').replace(/^#\/?/,'');
/* each page change is a history entry; the scroll position is saved so Back returns to the same spot */
function go(p){if(p!==path){try{history.replaceState({y:window.scrollY},'');history.pushState({y:0},'','#/'+p)}catch(e){try{location.hash='#/'+p}catch(_){}}}path=p;route()}
function route(){const h=path,parts=h.split('/'),x=t();
 document.documentElement.lang=lang;document.title='TRI-PIX — '+x.hero;
 let v,cur='';
 if(parts[0]==='projects'&&parts[1]){v=detail(parts[1]);cur='projects'}
 else if(parts[0]==='projects'){v=list();cur='projects'}
 else if(parts[0]==='digital'){v=digital();cur='digital'}else if(parts[0]==='video'){v=video();cur='video'}else v=home();
 app.innerHTML=v+`<footer><span>© ${x.brand}</span><span>${x.fsub}</span></footer>`;
 renderNav(cur);$('#logo').textContent=x.brand;
 if(pendingScroll&&!cur){const el=document.getElementById(pendingScroll);if(el)el.scrollIntoView({behavior:'smooth'});pendingScroll=null}else window.scrollTo(0,0);
 observe();document.querySelectorAll('video').forEach(v=>{v.muted=true;const p=v.play();if(p&&p.catch)p.catch(()=>{})})}
function renderNav(cur){const x=t();
 $('#nav').innerHTML=['services','team','contact'].map(k=>`<a href="#/" data-s="${k}">${x.nav[k]}</a>`).join('');
 $('#menu').textContent=$('#nav').classList.contains('open')?x.close:x.menu;
 document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===lang))}
function observe(){const els=document.querySelectorAll('.rv');
 if(!('IntersectionObserver'in window)){els.forEach(e=>e.classList.add('in'));return}
 const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{rootMargin:'0px 0px -6% 0px'});els.forEach(e=>io.observe(e))}

/* ---------- EVENTS ---------- */
const WEB=["assets/21.jpg", "assets/22.jpg", "assets/23.jpg", "assets/24.jpg", "assets/25.jpg", "assets/26.jpg", "assets/27.jpg", "assets/28.jpg", "assets/29.jpg", "assets/30.jpg"];
const webProjects=[
 {title:{ru:'Invest Group',en:'Invest Group'},

  menu:{ru:['Жилая недвижимость','Коммерческая недвижимость','О компании','Кейсы','Контакты'],en:['Residential','Commercial','About','Cases','Contacts']},

const dlg=$('#dlg'),dt=$('#dt'),db=$('#db');
function dOpen(wide){dlg.classList.remove('xl');dlg.classList.toggle('wide',!!wide);if(!dlg.open)dlg.showModal();dlg.scrollTop=0}
const FIG='https://www.figma.com/design/3Q2ssvWF4UKlYxnkusXyjq/%D0%9F%D0%BE%D1%80%D1%82%D1%84%D0%BE%D0%BB%D0%B8%D0%BE-%D0%AF%D0%BD%D0%BA%D0%BE%D0%B2%D0%BE%D0%B9-%D0%9E%D0%BB%D1%8C%D0%B3%D0%B8?node-id=1363-2003&t=b9ty62ANLgSAu7TL-1';
function openFigma(){const x=t();dt.textContent=x.dg[1][0];db.innerHTML=`<div class="fgw"><iframe src="https://www.figma.com/embed?embed_host=share&url=${encodeURIComponent(FIG)}" title="Figma" loading="lazy" allowfullscreen></iframe></div><div class="a ft"><a class="go" href="${FIG}" target="_blank" rel="noopener">${x.fo} ↗</a></div>`;dOpen(true);dlg.classList.add('xl')}
function discuss(){return `<div class="a ft"><button class="go" data-a="go">${t().discuss}</button></div>`}

function dSites(){const x=t();dt.textContent=x.web[0];
 db.innerHTML=`<p>${x.web[1]}</p><div class="wl">`+webProjects.map((p,i)=>`<button class="wp" data-i="${i}"><span class="th">${p.desktop[0]?`<img src="${p.desktop[0]}" alt="">`:`<span class="ph">${x.soon}</span>`}</span><span class="wt">${p.title[lang]}</span><span class="wy">${p.type[lang]||'&nbsp;'}</span></button>`).join('')+`</div>`+discuss();dOpen(true)}
function dProject(i){const x=t(),p=webProjects[i],ti=p.title[lang];dt.textContent=ti;
 const im=(a)=>a.map(s=>`<img src="${s}" alt="${ti}" loading="lazy">`).join('');
 const row=(l,a)=>`<div class="mn"><span>${l}</span>${a.map(m=>`<i>${m}</i>`).join('')}</div>`;
 db.innerHTML=(webProjects.length>1?`<button class="bk" data-a="back">${x.back}</button>`:'')+(p.type[lang]?`<div class="ty">${p.type[lang]}</div>`:'')+(p.desc[lang]?`<p>${p.desc[lang]}</p>`:'')+(p.links?`<div class="mn"><span>${x.lk}</span>${p.links[lang].map(l=>`<a href="${l[1]}" target="_blank" rel="noopener">${l[0]} ↗</a>`).join('')}</div>`:'')+(p.menu?row(x.menuL,p.menu[lang]):'')+(p.sections?row(x.blocks,p.sections[lang]):'')+(p.desktop.length?`<div class="shots">${im(p.desktop)}</div>`:`<p>${x.soonL}</p>`)+(p.mobile.length?`<h4>${x.mobile}</h4><div class="mob">${im(p.mobile)}</div>`:'')+(p.extra.length?`<h4>${x.modalL}</h4><div class="ex">${im(p.extra)}</div>`:'')+discuss();dOpen(true)}
dlg.addEventListener('click',e=>{
 const r=dlg.getBoundingClientRect();
 if(e.target===dlg&&(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)){dlg.close();return}
 const b=e.target.closest('#dx,[data-a],[data-i]');if(!b)return;
 if(b.id==='dx')dlg.close();
 else if(b.dataset.i!==undefined)dProject(+b.dataset.i);
 else if(b.dataset.a==='back')dSites();
 else if(b.dataset.a==='go'){dlg.close();const c=document.getElementById('contact');if(c)c.scrollIntoView({behavior:'smooth'})}
});
document.addEventListener('click',e=>{
 const sv=e.target.closest('[data-n]');if(sv){e.preventDefault();openSv(+sv.dataset.n);return}
 const fg=e.target.closest('[data-f]');if(fg){e.preventDefault();openFigma();return}
 const wk=e.target.closest('[data-w]');if(wk){e.preventDefault();dProject(+wk.dataset.w);return}
 const lb=e.target.closest('.lang button');if(lb){if(dlg.open)dlg.close();lang=lb.dataset.l;try{localStorage.setItem('lang',lang)}catch(_){}route();return}
 const a=e.target.closest('a[data-s]');
 if(a){e.preventDefault();const id=a.dataset.s;$('#nav').classList.remove('open');$('#menu').setAttribute('aria-expanded','false');
  if(path===''){document.getElementById(id).scrollIntoView({behavior:'smooth'})}else{pendingScroll=id;go('')}return}
 if(e.target.closest('nav a')){$('#nav').classList.remove('open');$('#menu').setAttribute('aria-expanded','false')}
 if(e.target.closest('#menu')){const n=$('#nav'),o=n.classList.toggle('open');$('#menu').setAttribute('aria-expanded',o);renderNav(path.indexOf('projects')===0?'projects':'')}
 const lk=e.target.closest('a[href^="#/"]');
 if(lk){e.preventDefault();$('#nav').classList.remove('open');$('#menu').setAttribute('aria-expanded','false');go(lk.getAttribute('href').replace(/^#\/?/,''))}
});
try{history.scrollRestoration='manual'}catch(e){}
window.addEventListener('popstate',e=>{path=(location.hash||'').replace(/^#\/?/,'');route();const y=e.state&&e.state.y;if(y)requestAnimationFrame(()=>window.scrollTo({top:y,behavior:'instant'}))});
window.addEventListener('hashchange',()=>{const p=(location.hash||'').replace(/^#\/?/,'');if(p!==path){path=p;route()}});
route();
</script>
